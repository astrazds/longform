<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Longform fixture page</title>
  <style>
    html, body { margin: 0; }
    #longform-top, #longform-bottom { height: 160px; margin: 0; }
    #longform-top { background: #ff2200; color: #fff; }
    #longform-bottom { background: #0033ff; color: #fff; }
    #longform-sticky { position: sticky; top: 0; height: 48px; margin: 0; background: #222; color: #fff; }
    #longform-span { height: 1600px; margin: 0; background: #f4f1ea; }
    p, h1 { margin: 0; padding: 16px; font: 20px/1.4 sans-serif; }
  </style>
</head>
<body>
  <p id="longform-top">LONGFORM-TOP</p>
  <p id="longform-sticky">LONGFORM-STICKY</p>
  <div id="longform-span"><h1>Longform fixture page</h1></div>
  <p id="longform-bottom">LONGFORM-BOTTOM</p>
</body>
</html>
