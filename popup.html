<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longform</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <h1>Full-page screenshot</h1>
    <div class="toolbar-actions">
      <button id="screenshotBtn" type="button" class="button-primary" aria-label="Save full-page screenshot as PNG" disabled>Save</button>
      <button id="copyBtn" type="button" class="button-secondary" aria-label="Copy full-page screenshot as PNG" disabled>Copy</button>
    </div>
    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="protocol.js"></script>
  <script src="clipboard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
