<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Longform</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="container">
    <h1></h1>
    <div class="toolbar-actions">
      <button id="screenshotBtn" type="button" class="button-primary" disabled></button>
      <button id="copyBtn" type="button" class="button-secondary" disabled></button>
    </div>
    <progress id="progress" max="1" aria-label="Capture progress" hidden></progress>
    <button id="cancelBtn" type="button" class="button-secondary" hidden>Cancel</button>
    <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>
  <script src="protocol.js"></script>
  <script src="capture-transfer.js"></script>
  <script src="capture-delivery.js"></script>
  <script src="clipboard.js"></script>
  <script src="popup.js"></script>
</body>
</html>
