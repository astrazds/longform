<!doctype html>
<meta charset="utf-8">
<title>Clipped descendant stays within the root surface</title>
<style>
  html, body { margin: 0; min-height: 600px; }
  .clip { height: 100px; overflow: hidden; background: #c9e5fa; }
  .oversized { height: 5000px; background: linear-gradient(#c9e5fa, #163a57); }
</style>
<main class="clip"><div class="oversized">Only the first 100px belongs to the root surface.</div></main>
