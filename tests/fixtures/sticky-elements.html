<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Longform Fixture - Sticky Elements</title>
    <style>
      body {
        margin: 0;
        background: #f4f7fb;
        color: #142030;
        font: 16px/1.55 system-ui, sans-serif;
      }

      header {
        position: sticky;
        top: 0;
        padding: 16px 24px;
        background: #142030;
        color: white;
        z-index: 5;
      }

      .float {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 12px 16px;
        background: #ffb000;
      }

      main {
        width: min(860px, calc(100% - 48px));
        margin: 0 auto;
      }

      section {
        min-height: 640px;
        padding: 32px 0;
        border-bottom: 1px solid #ccd8e5;
      }

      .end-marker {
        height: 64px;
        background: #ff3b8a;
      }
    </style>
  </head>
  <body>
    <header>Sticky header should not duplicate through the capture.</header>
    <div class="float">Fixed widget</div>
    <main>
      <section><h1>Sticky fixture</h1></section>
      <section><h2>Block 2</h2></section>
      <section><h2>Block 3</h2></section>
      <section><h2>Block 4</h2></section>
      <div class="end-marker" data-longform-end-marker></div>
    </main>
  </body>
</html>
