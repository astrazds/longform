<!doctype html>
<meta charset="utf-8">
<title>Same-size page changes never settle</title>
<style>
  html, body { margin: 0; min-height: 1800px; font: 24px monospace; }
  #changing { width: 200px; height: 40px; }
</style>
<p id="changing">State 0</p>
<p>Same-size text changes keep invalidating the document generation.</p>
<script>
  let state = 0;
  window.fixtureMutationTimer = setInterval(() => {
    document.querySelector('#changing').firstChild.data = `State ${++state % 10}`;
  }, 50);
</script>
